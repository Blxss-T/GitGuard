[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitguard-cli-blxss"
version = "0.1.0"
description = "A lightweight Git safety assistant that asks before committing changes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "watchdog>=6.0"
]

[project.scripts]
gitguard = "gitguard.cli:main"